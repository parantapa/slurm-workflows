[build-system]
requires = ["setuptools", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[project]
name = "slurm-workflows"
dynamic = ["version"]
authors = [
  { name="Parantapa Bhattacharya", email="parantapa@virginia.edu" },
]
description = "HPC workflow helpers for Slurm clusters."
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "click",
    "jinja2",
    "json5",
    "platformdirs",
    "cloudpickle",
    "typeguard>=3",
    "psutil",
    # NVIDIA's own NVML bindings, which the GPU monitor reads.
    "nvidia-ml-py",
    # The terminal UI `swtop` runs in.
    "textual",
    "ds-service-client>=7.0.0"
]

[project.optional-dependencies]
test = ["pytest"]
dev = ["black", "pyright"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# Deprecations fail the suite, and every other warning stays a warning.
# See the developer notes, Conventions.
filterwarnings = [
    "error::DeprecationWarning",
    "error::PendingDeprecationWarning",
]

# The target matches the `requires-python` floor,
# so the formatting does not drift
# with the Python version that runs black.
[tool.black]
target-version = ["py312"]

[tool.pyright]
include = ["src", "tests", "examples"]
pythonVersion = "3.12"

[tool.setuptools_scm]
fallback_version = "1.0.0-dev"

[project.urls]
"Homepage" = "https://github.com/parantapa/slurm-hpc-workflows"

[project.scripts]
"slurm-pilot-worker" = "slurm_workflows.slurm_pilot_worker:slurm_pilot_worker"
"swtop" = "slurm_workflows.swtop:swtop"
